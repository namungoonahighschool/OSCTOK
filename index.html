<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OscTok.Com</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #000000; --text-color: #e7e9ea; --border-color: #2f3336;
            --card-bg: #16181c; --accent-color: #1d9bf0; --secondary-text: #71767b;
        }
        [data-theme="light"] {
            --bg-color: #ffffff; --text-color: #0f1419; --border-color: #eff3f4;
            --card-bg: #f7f9f9; --accent-color: #1d9bf0; --secondary-text: #536471;
        }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); min-height: 100vh; padding-bottom: 50px; }
        header { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 20px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .auth-box, .post-box, .search-box { padding: 15px; border-bottom: 1px solid var(--border-color); }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        button { width: 100%; padding: 12px; margin: 5px 0; background: var(--accent-color); font-weight: 600; cursor: pointer; border: none; border-radius: 20px; color: #fff; font-family: 'Montserrat', sans-serif; }
        .post { padding: 15px; border-bottom: 1px solid var(--border-color); }
        .nav-links { font-size: 13px; padding: 10px 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: var(--accent-color); text-decoration: none; margin-right: 10px; font-weight: 500; }
        .theme-toggle { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 5px 10px; border-radius: 12px; width: auto; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header>
            <span>OscTok.Com</span>
            <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙 Theme</button>
        </header>
        
        <div class="nav-links">
            <div>
                <a href="index.html">Home</a>
                <a href="settings.html" id="settings-link" style="display:none;">⚙️ Settings</a>
                <a href="admin.html" id="admin-link" style="display:none; color: #00ba7c; font-weight: 700;">👑 Admin Panel</a>
            </div>
            <span id="user-display" style="color: var(--secondary-text);">Guest Mode</span>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 Search OscTok posts..." oninput="loadFeed(this.value)">
        </div>

        <div id="auth-section" class="auth-box">
            <h3 style="margin-top:0;">Join OscTok Today</h3>
            <p style="font-size:12px; color:var(--secondary-text);">Use admin code <b>osctokceo256</b> as password for admin access.</p>
            <input type="email" id="email" placeholder="Email address">
            <input type="password" id="password" placeholder="Password">
            <div style="display: flex; gap: 10px;">
                <button onclick="handleLogin()">Log In</button>
                <button onclick="handleSignup()" style="background:#00ba7c;">Sign Up</button>
            </div>
        </div>

        <div id="create-post-section" class="post-box" style="display:none;">
            <textarea id="post-text" placeholder="What's happening on OscTok?! (#hashtags supported)"></textarea>
            <input type="file" id="media-file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx">
            <button onclick="createPost()" style="width: 120px; float: right;">Post</button>
            <div style="clear: both;"></div>
        </div>

        <div id="feed"></div>
    </div>

    <script src="app.js"></script>
    <script>
        // Page-specific feed rendering
        async function createPost() {
            const text = document.getElementById('post-text').value;
            const fileInput = document.getElementById('media-file');
            const file = fileInput.files[0];
            
            let mediaUrl = null;
            let mediaType = null;

            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return alert('Please log in to post content.');
            if (!text.trim() && !file) return alert('Post cannot be empty.');

            if (file) {
                const fileExt = file.name.split('.').pop();
                const fileName = `post_${Date.now()}.${fileExt}`;
                const { error: uploadError } = await supabase.storage.from('media').upload(fileName, file);
                if (uploadError) return alert('Upload failed: ' + uploadError.message);

                const { data: publicURLData } = supabase.storage.from('media').getPublicUrl(fileName);
                mediaUrl = publicURLData.publicUrl;
                mediaType = file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : file.type.startsWith('audio/') ? 'audio' : 'document';
            }

            const { error } = await supabase.from('posts').insert([{ user_id: user.id, content: text, media_url: mediaUrl, media_type: mediaType }]);
            if (error) alert('Post error: ' + error.message);
            else { document.getElementById('post-text').value = ''; fileInput.value = ''; loadFeed(); }
        }

        async function loadFeed(searchQuery = '') {
            const feed = document.getElementById('feed');
            if (!feed) return;

            let query = supabase.from('posts').select(`*, profiles(username, avatar_url)`).order('created_at', { ascending: false });
            if (searchQuery.trim() !== '') query = query.ilike('content', `%${searchQuery}%`);

            const { data: posts, error } = await query;
            if (error) return;

            feed.innerHTML = posts.length === 0 ? `<p style="text-align:center; color:var(--secondary-text); padding:20px;">No posts found.</p>` : '';
            posts.forEach(post => {
                let mediaHtml = post.media_url ? (post.media_type === 'image' ? `<img src="${post.media_url}" style="max-width:100%; border-radius:12px; margin-top:10px;">` : post.media_type === 'video' ? `<video controls src="${post.media_url}" style="max-width:100%; border-radius:12px; margin-top:10px;"></video>` : `<audio controls src="${post.media_url}" style="width:100%; margin-top:10px;"></audio>`) : '';
                const avatar = post.profiles?.avatar_url || 'https://via.placeholder.com/40';
                const username = post.profiles?.username || 'OscTok User';

                feed.innerHTML += `
                    <div class="post">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                            <img src="${avatar}" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover;">
                            <div style="font-weight: 600; color: #71767b; font-size: 14px;">@${username}</div>
                        </div>
                        <div>${post.content}</div>
                        ${mediaHtml}
                    </div>
                `;
            });
        }
        loadFeed();
    </script>
</body>
</html>
