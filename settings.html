<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings - OscTok.Com</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #000; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        .card { background: #16181c; padding: 20px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #2f3336; }
        input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #2f3336; color: #fff; border-radius: 8px; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        button { background: #1d9bf0; cursor: pointer; border: none; font-weight: 600; }
        .back-nav a { color: #1d9bf0; text-decoration: none; font-weight: 500; }
        .avatar-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; display: block; border: 2px solid #2f3336; }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-nav"><a href="index.html">← Back to OscTok Feed</a></div>
        <h2>Account Settings & Profile</h2>
        
        <div class="card">
            <h3>Profile Customization</h3>
            <img id="current-avatar" class="avatar-preview" src="" alt="Avatar Preview" style="display:none;">
            <label>Profile Picture:</label>
            <input type="file" id="avatar-file" accept="image/*">
            
            <label>Username Handle:</label>
            <input type="text" id="setting-username" placeholder="Username">
            
            <label>Bio Description:</label>
            <textarea id="setting-bio" placeholder="Tell the world about yourself..."></textarea>
            
            <button onclick="saveProfileSettings()">Save Changes</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                alert('Please log in first.');
                window.location.href = 'index.html';
                return;
            }
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
            if (profile) {
                document.getElementById('setting-username').value = profile.username || '';
                document.getElementById('setting-bio').value = profile.bio || '';
                if (profile.avatar_url) {
                    const img = document.getElementById('current-avatar');
                    img.src = profile.avatar_url;
                    img.style.display = 'block';
                }
            }
        });

        async function saveProfileSettings() {
            const { data: { user } } = await supabase.auth.getUser();
            const username = document.getElementById('setting-username').value;
            const bio = document.getElementById('setting-bio').value;
            const avatarInput = document.getElementById('avatar-file');
            const file = avatarInput.files[0];

            let avatarUrl = null;

            if (file) {
                const fileExt = file.name.split('.').pop();
                const fileName = `avatar_${user.id}_${Date.now()}.${fileExt}`;
                const { error: uploadError } = await supabase.storage.from('media').upload(fileName, file);
                
                if (uploadError) {
                    alert('Avatar upload failed: ' + uploadError.message);
                    return;
                }
                const { data: publicURLData } = supabase.storage.from('media').getPublicUrl(fileName);
                avatarUrl = publicURLData.publicUrl;
            }

            const updateData = { username, bio };
            if (avatarUrl) updateData.avatar_url = avatarUrl;

            const { error } = await supabase.from('profiles').update(updateData).eq('id', user.id);
            if (error) alert('Error: ' + error.message);
            else {
                alert('Profile updated successfully!');
                location.reload();
            }
        }
    </script>
</body>
</html>
